<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Local game</p>
      <h1>Tic Tac Toe</h1>
    </header>

    <section class="panel" aria-label="Game setup">
      <div class="modes" role="group" aria-label="Opponent">
        <button type="button" class="mode is-active" data-mode="cpu">Vs computer</button>
        <button type="button" class="mode" data-mode="friend">Two players</button>
      </div>
      <p id="status" class="status" role="status">Your turn · X</p>
    </section>

    <div class="board-wrap">
      <div id="board" class="board" aria-label="Tic tac toe board">
        <button type="button" class="cell" data-index="0" aria-label="Row 1, column 1, empty"></button>
        <button type="button" class="cell" data-index="1" aria-label="Row 1, column 2, empty"></button>
        <button type="button" class="cell" data-index="2" aria-label="Row 1, column 3, empty"></button>
        <button type="button" class="cell" data-index="3" aria-label="Row 2, column 1, empty"></button>
        <button type="button" class="cell" data-index="4" aria-label="Row 2, column 2, empty"></button>
        <button type="button" class="cell" data-index="5" aria-label="Row 2, column 3, empty"></button>
        <button type="button" class="cell" data-index="6" aria-label="Row 3, column 1, empty"></button>
        <button type="button" class="cell" data-index="7" aria-label="Row 3, column 2, empty"></button>
        <button type="button" class="cell" data-index="8" aria-label="Row 3, column 3, empty"></button>
      </div>
    </div>

    <section class="score" aria-label="Score">
      <div><span id="score-x-label">You</span><strong id="score-x">0</strong></div>
      <div><span>Draws</span><strong id="score-draw">0</strong></div>
      <div><span id="score-o-label">Computer</span><strong id="score-o">0</strong></div>
    </section>

    <button type="button" id="new-game" class="new-game">New game</button>
  </main>
  <script src="game.js"></script>
</body>
</html>
